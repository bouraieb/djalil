workflows:
  android-apk:
    name: Build Makhzani Android APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Prepare offline web assets
        script: |
          set -eu
          mkdir -p android/app/src/main/assets/web
          cp index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png android/app/src/main/assets/web/
          mkdir -p android/app/src/main/res/drawable
          cp icon-192.png android/app/src/main/res/drawable/app_icon.png
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android APK
        script: |
          set -eu
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/makhzani-gradle.zip
          unzip -q /tmp/makhzani-gradle.zip -d /tmp/makhzani-gradle
          cd android
          /tmp/makhzani-gradle/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
